<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Grid Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .linha {
            border: 3px solid #212529;
            margin-bottom: 24px;
            padding: 10px;
            background-color: #ffffff;
        }

        .coluna {
            min-height: 120px;
            border: 2px dashed #212529;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 3px #000000;
            background-position: center;
            background-size: cover;
            background-blend-mode: multiply;
        }

        .linha-1 .coluna {
            background-color: #8d5524;
            background-image: url('https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1200&q=80');
            min-height: 220px;
        }

        .linha-2 .coluna:first-child {
            background-color: #6b8e23;
            background-image: url('https://images.unsplash.com/photo-1589924691995-400dc9ecc119?auto=format&fit=crop&w=900&q=80');
        }

        .linha-2 .coluna:last-child {
            background-color: #b5651d;
            background-image: url('https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=900&q=80');
        }

        .linha-3 .coluna:nth-child(1) {
            background-color: #4682b4;
            background-image: url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=800&q=80');
        }

        .linha-3 .coluna:nth-child(2) {
            background-color: #a0522d;
            background-image: url('https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=800&q=80');
        }

        .linha-3 .coluna:nth-child(3),
        .coluna-veterinario {
            background-color: #2f4f4f;
            background-image: url('https://images.unsplash.com/photo-1628009368231-7bb7cfcb0def?auto=format&fit=crop&w=800&q=80');
        }

        .linha-4 .coluna:first-child {
            background-color: #6a5acd;
            background-image: url('https://images.unsplash.com/photo-1601758228041-f3b2795255f1?auto=format&fit=crop&w=800&q=80');
        }

        .linha-4 .coluna:last-child {
            background-color: #008080;
            background-image: url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1000&q=80');
        }

        .jumbotron-simples {
            background-color: rgba(255, 183, 3, 0.88);
            border: 3px solid #212529;
            padding: 32px;
            color: #212529;
            text-shadow: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#inicio">PetShop Patinhas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#produtos">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#servicos">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4" id="inicio">
        <h1 class="text-center mb-4">PetShop Patinhas</h1>

        <!-- Linha 1: 1 coluna de tamanho 12 -->
        <div class="row linha linha-1" id="inicio-grid">
            <div class="col-12 coluna">
                <div class="jumbotron-simples w-100">
                    <h2>Bem-vindo ao PetShop Patinhas!</h2>
                    <p class="mb-0">Tudo para cuidar do seu melhor amigo.</p>
                </div>
            </div>
        </div>

        <!-- Linha 2: 2 colunas de tamanho 6 -->
        <div class="row linha linha-2" id="produtos">
            <div class="col-12 col-md-6 coluna">Rações</div>
            <div class="col-12 col-md-6 coluna">Brinquedos</div>
        </div>

        <!-- Linha 3: 3 colunas de tamanho 4 -->
        <div class="row linha linha-3" id="servicos">
            <div class="col-12 col-md-4 coluna">Banho</div>
            <div class="col-12 col-md-4 coluna">Tosa</div>
            <div class="col-12 col-md-4 coluna coluna-veterinario" id="veterinario">
                <strong>Veterinário</strong>
            </div>
        </div>

        <!-- Linha 4: 1 coluna de tamanho 4 e 1 coluna de tamanho 8 -->
        <div class="row linha linha-4" id="contato">
            <div class="col-12 col-md-4 coluna">Contato</div>
            <div class="col-12 col-md-8 coluna">Sobre o PetShop</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
